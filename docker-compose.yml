services:
  mugs:
    build:
      context: .
      dockerfile: Dockerfile
    image: mugs:latest
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      TZ: UTC
      APP_TIME_LOCAL_ZONE: America/New_York
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/mugs.db
      # Set these in a .env file or your deployment environment.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://jrtcojpgdubbmgsmnhgs.supabase.co/auth/v1
      APP_SECURITY_JWT_AUDIENCE: authenticated
    volumes:
      - mugs-data:/data
    restart: unless-stopped

volumes:
  mugs-data:

