spring.application.name=mugs
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://jrtcojpgdubbmgsmnhgs.supabase.co/auth/v1}
app.security.jwt.audience=${APP_SECURITY_JWT_AUDIENCE:authenticated}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:./mugs.db}
