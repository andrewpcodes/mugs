spring.application.name=mugs
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://jrtcojpgdubbmgsmnhgs.supabase.co/auth/v1}
app.security.jwt.audience=${APP_SECURITY_JWT_AUDIENCE:authenticated}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:./mugs.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
# Databases created before Flyway already hold the V1 schema; record them as V1 and apply later versions.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
springdoc.api-docs.enabled=false
springdoc.swagger-ui.url=/api-specification.yml
app.time.local-zone=${APP_TIME_LOCAL_ZONE:America/New_York}
app.cors.allowed-origins=http://localhost:5173
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}
app.cors.allow-credentials=${APP_CORS_ALLOW_CREDENTIALS:false}
app.cors.max-age=${APP_CORS_MAX_AGE:3600}
